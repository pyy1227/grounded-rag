<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>企业知识库 RAG 助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='15' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f5f5f5;
    --panel: #ffffff;
    --border: #d9d9d9;
    --line: #f0f0f0;
    --text: #262626;
    --text-2: #595959;
    --text-3: #8c8c8c;
    --accent: #1677ff;
    --accent-hover: #4096ff;
    --accent-weak: #e6f4ff;
    --accent-border: #91caff;
    --ok: #389e0d;
    --warn: #d46b08;
    --danger: #cf1322;
    --mono: Consolas, "Courier New", "Microsoft YaHei", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 46px;
    padding: 0 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .version { font-size: 12px; color: #bfbfbf; }

  .pills {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0;
    margin-left: auto;
    font-size: 12px;
    color: var(--text-3);
  }
  .pill { display: inline; padding: 0; border: 0; background: none; white-space: nowrap; }
  .pill b { margin-left: 4px; font-weight: 500; color: var(--text-2); }
  .pill + .pill::before { content: "·"; margin: 0 8px; color: #d9d9d9; }
  .pill.pill-warn, .pill.pill-warn b { color: var(--warn); }

  /* ---------- 标签栏 ---------- */
  .tabbar { background: var(--panel); border-bottom: 1px solid var(--border); }
  .tabs { display: flex; gap: 28px; max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  .tab {
    position: relative;
    padding: 10px 0;
    border: 0;
    background: none;
    font: inherit;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
  }
  .tab:hover { color: var(--accent); }
  .tab.active { color: var(--accent); font-weight: 500; }
  .tab.active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 2px;
    background: var(--accent);
  }

  main { max-width: 1180px; margin: 0 auto; padding: 16px 20px 56px; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ---------- 基础元件 ---------- */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
  }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  input[type="text"], select {
    height: 32px;
    padding: 0 8px;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 2px;
    outline: none;
  }
  input[type="text"]:hover, select:hover { border-color: var(--accent-border); }
  input[type="text"]:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(22, 119, 255, .1);
  }
  input:disabled, select:disabled { background: #f5f5f5; color: #bfbfbf; cursor: not-allowed; }

  .btn {
    height: 32px;
    padding: 0 14px;
    font: inherit;
    font-size: 13px;
    border: 1px solid transparent;
    border-radius: 2px;
    cursor: pointer;
  }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-ghost { background: #fff; border-color: var(--border); color: var(--text-2); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

  /* 状态标签：方角，替代胶囊 */
  .badge {
    display: inline-block;
    padding: 0 6px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: #fafafa;
    color: var(--text-2);
    font-size: 12px;
    font-weight: 400;
    line-height: 18px;
    white-space: nowrap;
  }
  .badge.accent { background: var(--accent-weak); border-color: var(--accent-border); color: #0958d9; }
  .badge.ok { background: #f6ffed; border-color: #b7eb8f; color: var(--ok); }
  .badge.danger { background: #fff1f0; border-color: #ffa39e; color: var(--danger); }
  .badge.warn { background: #fff7e6; border-color: #ffd591; color: var(--warn); }

  .section-title { margin: 16px 0 8px; font-size: 12.5px; font-weight: 500; color: var(--text-3); }
  .hint { margin: 8px 0 0; font-size: 12px; color: var(--text-3); }
  .muted { color: var(--text-3); }
  .mono { font-family: var(--mono); }

  .notice {
    margin: 0 0 12px;
    padding: 6px 12px;
    border: 1px solid #ffe58f;
    border-left: 3px solid #faad14;
    border-radius: 2px;
    background: #fffbe6;
    color: #614700;
    font-size: 12.5px;
  }

  /* ---------- 问答 ---------- */
  .searchbar { padding: 12px; }
  .searchbar input[type="text"] { flex: 1 1 320px; min-width: 0; }

  .examples { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .examples::before { content: "示例"; font-size: 12px; color: var(--text-3); }

  .chip {
    padding: 1px 8px;
    font: inherit;
    font-size: 12px;
    color: var(--text-2);
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent-border); background: #fff; color: #0958d9; }

  .answer-card { margin-top: 12px; padding: 14px 16px; border-left: 3px solid var(--accent); }
  .answer-card.is-refused { border-left-color: var(--danger); }
  .answer-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .answer-text { font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .answer-text strong { font-weight: 600; }
  .inline-code {
    padding: 0 4px;
    font-family: var(--mono);
    font-size: 12.5px;
    background: #f5f5f5;
    border: 1px solid var(--line);
    border-radius: 2px;
  }

  .cite-ref { margin: 0 1px; font-size: 11px; color: var(--accent); vertical-align: 2px; }
  .cite-ref:hover { text-decoration: underline; }

  .cite-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
  .cite-card {
    display: block;
    width: 100%;
    padding: 10px 12px;
    text-align: left;
    font: inherit;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
  }
  .cite-card:hover { border-color: var(--accent-border); background: #fafcff; }
  .cite-card.flash { border-color: var(--accent); background: var(--accent-weak); }

  .cite-head { display: flex; gap: 6px; align-items: baseline; }
  .cite-index { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .cite-doc { font-size: 12.5px; font-weight: 500; }
  .cite-section { margin-top: 2px; font-size: 12px; color: var(--text-3); }
  .cite-snippet {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--text-2);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cite-foot { margin-top: 6px; }
  .chunk-id { font-family: var(--mono); font-size: 11px; color: #bfbfbf; }

  /* ---------- Agent 轨迹 ---------- */
  .trace-card { margin-top: 12px; padding: 14px 16px; }
  .trace-card .section-title { margin-top: 0; }

  .trace { list-style: none; margin: 0; padding: 0; }
  .trace-item { padding: 10px 0; border-top: 1px solid var(--line); }
  .trace-item:first-child { padding-top: 0; border-top: 0; }

  .trace-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .trace-step { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
  .trace-latency { font-size: 11.5px; color: var(--text-3); }
  .trace-tool { margin-top: 4px; font-family: var(--mono); font-size: 12.5px; color: #0958d9; }
  .trace-pre {
    margin: 6px 0 0;
    padding: 8px 10px;
    background: #fafafa;
    border: 1px solid var(--line);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.55;
    color: var(--text-2);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 220px;
    overflow: auto;
  }
  .trace-pre.err { background: #fff2f0; border-color: #ffccc7; color: var(--danger); }
  .trace-note { margin-top: 4px; font-size: 12px; color: var(--warn); }

  /* ---------- 检索结果 ---------- */
  .result-count { margin: 14px 0 8px; font-size: 12px; color: var(--text-3); }
  .hit { padding: 12px 14px; margin-bottom: 8px; }

  .hit-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .rank { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
  .hit-doc { font-size: 13px; font-weight: 500; }
  .hit-section { font-size: 12px; color: var(--text-3); }

  .scores { display: grid; gap: 4px; margin-top: 10px; max-width: 620px; }
  .score-row { display: grid; grid-template-columns: 56px 1fr 52px; align-items: center; gap: 8px; }
  .score-label { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
  .score-track { height: 6px; background: #f0f0f0; border-radius: 1px; overflow: hidden; }
  .score-fill { height: 100%; background: #bfbfbf; }
  .score-fill.bm25 { background: #d9d9d9; }
  .score-fill.vector { background: #bae0ff; }
  .score-fill.fused { background: #69b1ff; }
  .score-fill.rerank { background: #389e0d; }
  .score-num {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-2);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .reasons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .reason {
    padding: 0 6px;
    font-size: 11.5px;
    color: var(--text-3);
    background: #fafafa;
    border: 1px solid var(--line);
    border-radius: 2px;
  }

  .hit-text {
    margin: 8px 0 0;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--text-2);
    white-space: pre-wrap;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hit-text.expanded { display: block; -webkit-line-clamp: unset; }

  mark { background: #fff1b8; color: inherit; }

  .expand {
    margin-top: 4px;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
  }
  .expand:hover { text-decoration: underline; }

  /* ---------- 表格 ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: #fafafa; font-size: 12px; font-weight: 500; color: var(--text-2); }
  tbody tr:hover { background: #fafcff; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.wrap { white-space: normal; }

  /* ---------- 评测 ---------- */
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
    margin: 12px 0;
  }
  .metric {
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
  }
  .metric .k { font-size: 12px; color: var(--text-3); }
  .metric .v { margin-top: 2px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .metric .v.good { color: var(--ok); }

  .card-title { padding: 12px 12px 0; font-size: 13px; font-weight: 500; }
  .card-note { margin: 4px 0 0; padding: 0 12px; }
  .card > .table-wrap { margin-top: 8px; }

  details { margin-top: 12px; }
  summary { cursor: pointer; font-size: 12.5px; color: var(--text-2); }
  summary:hover { color: var(--accent); }

  /* ---------- 状态 ---------- */
  .empty { padding: 40px 16px; text-align: center; font-size: 13px; color: var(--text-3); }

  .error-box {
    padding: 10px 12px;
    border: 1px solid #ffccc7;
    border-left: 3px solid #ff4d4f;
    border-radius: 2px;
    background: #fff2f0;
    color: var(--danger);
    font-size: 12.5px;
    white-space: pre-wrap;
  }

  .skeleton { padding: 16px; }
  .sk-line {
    height: 10px;
    margin-bottom: 10px;
    background: #f0f0f0;
    border-radius: 1px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .sk-line:nth-child(2) { width: 86%; }
  .sk-line:nth-child(3) { width: 58%; }
  @keyframes pulse { 50% { opacity: .5; } }

  #toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 50;
    padding: 8px 14px;
    background: #262626;
    color: #fff;
    font-size: 12.5px;
    border-radius: 2px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 760px) {
    .topbar { height: auto; padding: 8px 16px; flex-wrap: wrap; }
    .pills { width: 100%; margin-left: 0; }
    .tabs, main { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>企业知识库 RAG 助手</h1>
    <span class="version">v0.1.0</span>
  </div>
  <div class="pills" id="health">
    <span class="pill">连接中…</span>
  </div>
  <button class="btn btn-ghost btn-sm" id="health-refresh" type="button" title="刷新索引状态">刷新</button>
</header>

<div class="tabbar">
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="ask" role="tab">问答</button>
    <button class="tab" data-tab="search" role="tab">检索</button>
    <button class="tab" data-tab="docs" role="tab">知识库</button>
    <button class="tab" data-tab="eval" role="tab">评测</button>
  </nav>
</div>

<main>
  <!-- ==================== 问答 ==================== -->
  <section class="panel active" id="panel-ask">
    <form class="card searchbar" id="ask-form">
      <div class="row">
        <input type="text" id="ask-q" placeholder="问点什么，例如：退货运费谁承担" autocomplete="off" />
        <select id="ask-mode" title="回答方式">
          <option value="/chat">问答 /chat</option>
          <option value="/agent">Agent /agent</option>
        </select>
        <select id="ask-k" title="召回条数">
          <option value="3">Top-3</option>
          <option value="5" selected>Top-5</option>
          <option value="8">Top-8</option>
        </select>
        <button class="btn btn-primary" type="submit" id="ask-submit">提问</button>
      </div>
      <div class="examples" id="ask-examples">
        <button type="button" class="chip" data-q="退货运费谁承担">退货运费谁承担</button>
        <button type="button" class="chip" data-q="发票什么时候能开">发票什么时候能开</button>
        <button type="button" class="chip" data-q="退货时效和换货时效有什么区别" data-mode="/agent">换货 vs 退货（Agent）</button>
        <button type="button" class="chip" data-q="支持货到付款吗">拒答演示</button>
      </div>
    </form>
    <div id="ask-result">
      <div class="card empty">输入问题后，这里显示答案与引用来源。</div>
    </div>
  </section>

  <!-- ==================== 检索 ==================== -->
  <section class="panel" id="panel-search">
    <form class="card searchbar" id="search-form">
      <div class="row">
        <input type="text" id="search-q" placeholder="只检索不生成，看每一路的原始分数" autocomplete="off" />
        <select id="search-k" title="返回条数">
          <option value="3">Top-3</option>
          <option value="5" selected>Top-5</option>
          <option value="8">Top-8</option>
          <option value="10">Top-10</option>
        </select>
        <button class="btn btn-primary" type="submit">检索</button>
      </div>
      <p class="hint">条形按本组结果归一化，仅用于同一路召回的横向比较。</p>
    </form>
    <div id="search-result">
      <div class="card empty">返回每条命中，并给出 bm25 / vector / fused / rerank 四层分数。</div>
    </div>
  </section>

  <!-- ==================== 知识库 ==================== -->
  <section class="panel" id="panel-docs">
    <div class="card searchbar">
      <div class="row">
        <div class="muted" style="flex:1 1 auto">当前已入库的文档，按 sha256 幂等去重。</div>
        <button class="btn btn-ghost" type="button" id="docs-refresh">刷新</button>
      </div>
      <div class="row" style="margin-top:12px">
        <input type="text" id="ingest-path" value="data/docs" style="flex:1 1 260px" aria-label="入库路径" />
        <label class="muted" style="display:flex;align-items:center;gap:6px;font-size:13px">
          <input type="checkbox" id="ingest-force" /> 强制重建
        </label>
        <button class="btn btn-ghost" type="button" id="ingest-run">执行入库</button>
      </div>
      <div id="ingest-result"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="table-wrap" id="docs-table">
        <div class="empty">加载中…</div>
      </div>
    </div>
  </section>

  <!-- ==================== 评测 ==================== -->
  <section class="panel" id="panel-eval">
    <div class="card searchbar">
      <div class="row">
        <input type="text" id="eval-dataset" value="data/eval/queries.jsonl" style="flex:1 1 320px" aria-label="评测集路径" />
        <label class="muted" style="display:flex;align-items:center;gap:6px;font-size:13px">
          <input type="checkbox" id="eval-sweep" checked /> 阈值扫描
        </label>
        <button class="btn btn-primary" type="button" id="eval-run">跑评测</button>
      </div>
      <p class="hint">同一评测集下可对比不同配置；阈值扫描会多跑几轮。</p>
    </div>
    <div id="eval-result">
      <div class="card empty">运行评测后，这里输出指标、阈值扫描与逐条样本。</div>
    </div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  // ==================== 工具 ====================
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function escapeHtml(text) {
    return String(text ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function badge(text, variant) {
    return el("span", "badge" + (variant ? " " + variant : ""), text);
  }

  let toastTimer = null;
  function toast(message) {
    const node = $("#toast");
    node.textContent = message;
    node.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => node.classList.remove("show"), 1800);
  }

  async function api(path, options = {}) {
    const init = { method: options.method || "GET", headers: {} };
    if (options.body !== undefined) {
      init.headers["Content-Type"] = "application/json";
      init.body = JSON.stringify(options.body);
    }
    const response = await fetch(path, init);
    if (!response.ok) {
      let detail = "";
      try {
        const payload = await response.json();
        detail = payload.detail || JSON.stringify(payload);
      } catch (_) {
        detail = await response.text().catch(() => "");
      }
      throw new Error(`HTTP ${response.status} ${response.statusText}${detail ? " — " + detail : ""}`);
    }
    return response.json();
  }

  function highlightText(text, query) {
    const source = String(text ?? "");
    const raw = String(query ?? "").trim();
    if (!raw) return escapeHtml(source);

    const tokens = Array.from(new Set([raw, ...raw.split(/\s+/)]))
      .filter(Boolean)
      .sort((a, b) => b.length - a.length);
    const lower = source.toLowerCase();

    let out = "";
    let cursor = 0;
    while (cursor < source.length) {
      let bestIndex = -1;
      let bestLength = 0;
      for (const token of tokens) {
        const index = lower.indexOf(token.toLowerCase(), cursor);
        if (index === -1) continue;
        if (bestIndex === -1 || index < bestIndex || (index === bestIndex && token.length > bestLength)) {
          bestIndex = index;
          bestLength = token.length;
        }
      }
      if (bestIndex === -1) {
        out += escapeHtml(source.slice(cursor));
        break;
      }
      out += escapeHtml(source.slice(cursor, bestIndex));
      out += "<mark>" + escapeHtml(source.slice(bestIndex, bestIndex + bestLength)) + "</mark>";
      cursor = bestIndex + bestLength;
    }
    return out;
  }

  function scoreRow(label, value, max, className) {
    const row = el("div", "score-row");
    row.appendChild(el("span", "score-label", label));
    const track = el("div", "score-track");
    const fill = el("div", "score-fill " + className);
    const ratio = max > 0 ? Math.max(0, Math.min(1, Math.abs(value) / max)) : 0;
    fill.style.width = (ratio * 100).toFixed(1) + "%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("span", "score-num", Number(value || 0).toFixed(3)));
    return row;
  }

  function renderHit(hit, rank, query, scale) {
    const card = el("article", "card hit");

    const head = el("div", "hit-head");

    const scores = el("div", "scores");

    scores.appendChild(scoreRow("vector", hit.vector, scale.vector, "vector"));
    scores.appendChild(scoreRow("fused", hit.fused, scale.fused, "fused"));
    scores.appendChild(scoreRow("rerank", hit.rerank, scale.rerank, "rerank"));
    card.appendChild(scores);

    if (hit.reasons && hit.reasons.length) {
      const reasons = el("div", "reasons");
      hit.reasons.forEach((reason) => reasons.appendChild(el("span", "reason", reason)));
      card.appendChild(reasons);

    const text = el("p", "hit-text");

    const toggle = el("button", "expand", "展开全文");

    return card;
  }

      const scale = {

        vector: Math.max(...hits.map((h) => Math.abs(h.vector || 0)), 1e-9),
        fused: Math.max(...hits.map((h) => Math.abs(h.fused || 0)), 1e-9),
        rerank: Math.max(...hits.map((h) => Math.abs(h.rerank || 0)), 1e-9),

      container.appendChild(el("div", "result-count", `命中 ${hits.length} 条 · 查询「${query}」`));

  // 演示时可以直接把链接发出去，不用现场输入。
  const params = new URLSearchParams(location.search);
  const presetQuestion = (params.get("q") || "").trim();
  const presetSearch = (params.get("s") || "").trim();

  if (presetQuestion) {
    $("#ask-q").value = presetQuestion;
    if (["/agent", "agent"].includes(params.get("mode"))) {
      $("#ask-mode").value = "/agent";
      $("#ask-mode").dispatchEvent(new Event("change"));
    }
    if (["3", "5", "8"].includes(params.get("k"))) $("#ask-k").value = params.get("k");
  }
  if (presetSearch) {
    $("#search-q").value = presetSearch;
  }

  const initialTab = (location.hash || "").replace("#", "");
  const startTab = presetSearch ? "search" : presetQuestion ? "ask" : initialTab;
  activateTab(document.getElementById("panel-" + startTab) ? startTab : "ask");
  loadHealth();

  if (presetQuestion) runAsk(presetQuestion);
  if (presetSearch) runSearch(presetSearch);
})();
</script>
</body>
</html>
