[project]
name = "ragagent"
version = "0.1.0"
description = "可评测的企业 RAG 知识助手 + Agent 层"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0,<2.0.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
# 中文分词可选：装了 jieba 用词典分词，没装则回退到字符 bigram（召回略降）
zh = ["jieba>=0.42.1"]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ragagent = "ragagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试里用 `from src.ragagent import ...`，显式把仓库根放进 sys.path，
# 这样从任意目录调用 pytest 都能解析（CI 与本地行为一致）。
pythonpath = ["."]
cache_dir = ".cache/pytest"



